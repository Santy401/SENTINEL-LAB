name: iOS app

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "packages/protocol/examples/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "packages/protocol/examples/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  sentinelkit-linux:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v7
      - name: Check fixtures match the shared contract examples
        run: |
          for kind in valid invalid; do
            diff -r "packages/protocol/examples/$kind" "apps/ios/SentinelKit/Tests/SentinelKitTests/Fixtures/$kind"
          done
      - name: swift test
        working-directory: apps/ios/SentinelKit
        run: swift test

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: SentinelKit tests (macOS)
        working-directory: apps/ios/SentinelKit
        run: swift test
      - name: Build app for iOS Simulator (unsigned)
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project SentinelLab.xcodeproj \
            -scheme SentinelLab \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Build app for iOS device (unsigned, not installable as is)
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project SentinelLab.xcodeproj \
            -scheme SentinelLab \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO

      # An unsigned IPA. iOS refuses it until it is signed for a device, e.g.
      # by Xcode or a free-Apple-ID signer on the owner's machine
      # (docs/ios/README.md). It contains no credentials: the realtime token
      # is entered in the app and stored in the Keychain.
      - name: Package unsigned IPA
        working-directory: apps/ios
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/SentinelLab.app
          test -d "$APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../SentinelLab-unsigned.ipa Payload)
          shasum -a 256 build/SentinelLab-unsigned.ipa | tee build/SentinelLab-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SentinelLab-unsigned-ipa
          path: |
            apps/ios/build/SentinelLab-unsigned.ipa
            apps/ios/build/SentinelLab-unsigned.ipa.sha256
          retention-days: 14
