name: Firmware build

on:
  push:
    paths:
      - "platformio.ini"
      - "include/**"
      - "src/**"
      - "test/**"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "platformio.ini"
      - "include/**"
      - "src/**"
      - "test/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - sentinel_esp32s3_n16r8
          - sentinel_esp32s3_n16r8_diag
          - sentinel_esp32s3_n16r8_v02
          - sentinel_esp32s3_n16r8_rf
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare placeholder Wi-Fi config
        run: cp include/secrets.example.h include/secrets.h

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ matrix.environment }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.environment }}-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip platformio

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
