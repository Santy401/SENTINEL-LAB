name: Protocol validation

on:
  push:
    paths:
      - "packages/protocol/**"
      - "docs/protocol-contract.md"
      - "docs/decisions/ADR-0004-protocolo-v1.md"
      - "docs/rf-protocol.md"
      - "docs/architecture/overview.md"
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - ".github/workflows/protocol-validation.yml"
  pull_request:
    paths:
      - "packages/protocol/**"
      - "docs/protocol-contract.md"
      - "docs/decisions/ADR-0004-protocolo-v1.md"
      - "docs/rf-protocol.md"
      - "docs/architecture/overview.md"
      - "src/**"
      - "include/**"
      - "platformio.ini"
      - ".github/workflows/protocol-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install protocol validator
        run: python -m pip install -r packages/protocol/requirements.txt

      - name: Validate valid examples
        run: python3 packages/protocol/validate_protocol.py packages/protocol/examples/valid

      - name: Ensure every invalid example is rejected
        run: python3 packages/protocol/validate_protocol.py --expect-invalid packages/protocol/examples/invalid

      - name: Run protocol tests
        run: python3 -m unittest discover -s packages/protocol/tests -v
