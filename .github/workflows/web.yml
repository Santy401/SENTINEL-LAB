name: Web dashboard

on:
  push:
    paths:
      - "apps/web/**"
      - "web_assets/**"
      - "tools/embed_web.py"
      - "packages/protocol/examples/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "web_assets/**"
      - "tools/embed_web.py"
      - "packages/protocol/examples/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and render tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Embedded firmware bundle matches this build
        working-directory: .
        run: python3 tools/embed_web.py --check

      - name: Report bundle size
        run: du -ah dist | sort -h | tail -n 5
