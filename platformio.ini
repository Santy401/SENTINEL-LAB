[platformio]
default_envs = sentinel_esp32s3_n16r8

[env:sentinel_esp32s3_n16r8]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

; Verified with esptool on /dev/ttyACM0:
;   flash = 16 MB (manufacturer c2, device 2018, quad, 3.3 V)
;   PSRAM = 8 MB embedded, octal (OPI)
; The stock board targets N8 (8 MB, no PSRAM), so overrides are explicit.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Keep the v0.2.0 sources out of this legacy environment.
build_src_filter =
    +<*>
    -<v02/*>
    -<rf/*>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 460800

; Verified against framework-arduinoespressif32 4.30312.0 (Arduino-ESP32 3.x)
; and ESP32-S3 (LEDC/MCPWM PWM allocation).
lib_deps =
    madhephaestus/ESP32Servo@3.2.1

[env:sentinel_esp32s3_n16r8_diag]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

; Keep the v0.2.0 sources out of this legacy environment.
build_src_filter =
    +<*>
    -<v02/*>
    -<rf/*>

; Diagnostic-only build: verbose distance/echo telemetry.
; Servo stays disabled via config::kServoEnabledByDefault = false.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSENTINEL_DIAGNOSTIC_MODE=1

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    madhephaestus/ESP32Servo@3.2.1

; ---------------------------------------------------------------------------
; SENTINEL v0.2.0 — local Wi-Fi dashboard + motion detection.
; Only src/v02/* is compiled here: HC-SR04 and servo drivers are excluded.
; Wi-Fi credentials come from the gitignored include/secrets.h.
; ---------------------------------------------------------------------------
[env:sentinel_esp32s3_n16r8_v02]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

build_src_filter =
    +<v02/*>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; SENTINEL RF: no ultrasonic/servo sources, reuse tested motion components.
[env:sentinel_esp32s3_n16r8_rf]
extends = env:sentinel_esp32s3_n16r8_v02
build_src_filter =
    +<rf/*>
    +<v02/motion_engine.cpp>
    +<v02/led_indicator.cpp>
    +<v02/wifi_ap.cpp>
    +<v02/web_dashboard.cpp>
build_flags =
    ${env:sentinel_esp32s3_n16r8_v02.build_flags}
    -DSENTINEL_RF=1
