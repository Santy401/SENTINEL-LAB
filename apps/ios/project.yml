# XcodeGen spec. Generate the project on macOS with:
#   brew install xcodegen && cd apps/ios && xcodegen generate
# Set DEVELOPMENT_TEAM (your Apple ID Personal Team or paid team) before
# building for a physical iPhone; leave it empty for unsigned simulator builds.
name: SentinelLab
options:
  bundleIdPrefix: lab.sentinel
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  SentinelKit:
    path: SentinelKit
targets:
  SentinelLab:
    type: application
    platform: iOS
    sources:
      - path: SentinelLab
    info:
      path: SentinelLab/Resources/Info.plist
    dependencies:
      - package: SentinelKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.sentinel.app
        PRODUCT_NAME: SentinelLab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
  SentinelLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SentinelLabTests
    dependencies:
      - target: SentinelLab
      - package: SentinelKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.sentinel.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SentinelLab:
    build:
      targets:
        SentinelLab: all
        SentinelLabTests: [test]
    test:
      targets:
        - SentinelLabTests
